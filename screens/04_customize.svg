<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;">
  <rect width="390" height="844" rx="44" fill="#FFFFFF"/>
  <rect x="1" y="1" width="388" height="842" rx="43" fill="none" stroke="#E5E3DD" stroke-width="2"/>

  <!-- DYNAMIC ISLAND -->
  <rect x="135" y="12" width="120" height="30" rx="15" fill="#111111"/>
  <text x="36" y="32" font-size="14" fill="#111111" font-weight="600">10:11</text>
  <g transform="translate(325, 22)">
    <path d="M0 10 L3 10 M5 8 L8 8 M10 5 L13 5 M15 2 L18 2" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <rect x="24" y="2" width="20" height="10" rx="3" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="26" y="4" width="14" height="6" rx="1.5" fill="#111111"/>
    <line x1="45" y1="5" x2="45" y2="9" stroke="#111111" stroke-width="1.5"/>
  </g>

  <!-- TOP HEADER -->
  <g transform="translate(24, 60)">
    <path d="M12 0 L2 10 L12 20" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="16" font-size="20" fill="#111111" font-weight="700">Item details</text>
    <circle cx="338" cy="10" r="14" fill="#F4F3EE"/>
    <path d="M333 5 L343 15 M343 5 L333 15" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- FOOD ITEM PHOTO BOX -->
  <g transform="translate(24, 104)">
    <rect width="342" height="160" rx="16" fill="#F7F6F2" stroke="#E2DFD7" stroke-width="1"/>
    <line x1="0" y1="0" x2="342" y2="160" stroke="#ECEAE4" stroke-width="1.5"/>
    <line x1="0" y1="160" x2="342" y2="0" stroke="#ECEAE4" stroke-width="1.5"/>
    <rect x="96" y="65" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#DCD9D0" stroke-width="1"/>
    <text x="171" y="84" font-size="12" fill="#555555" font-weight="600" text-anchor="middle" font-family="monospace">[DISH PHOTO]</text>
  </g>

  <!-- DISH TITLE & PRICE -->
  <g transform="translate(24, 284)">
    <text x="0" y="20" font-size="22" fill="#111111" font-weight="800">Pad see ew</text>
    <text x="342" y="20" font-size="22" fill="#111111" font-weight="800" text-anchor="end">$14.50</text>
    <text x="0" y="44" font-size="14" fill="#666666" width="342">
      <tspan x="0" dy="0">Thick flat rice noodles stir-fried with egg, Chinese broccoli,</tspan>
      <tspan x="0" dy="20">and sweet dark soy sauce.</tspan>
    </text>
  </g>

  <!-- SELECTION GROUP: CHOOSE PROTEIN (REQUIRED) -->
  <g transform="translate(24, 368)">
    <line x1="0" y1="0" x2="342" y2="0" stroke="#EAE8E1" stroke-width="1"/>
    
    <text x="0" y="30" font-size="16" fill="#111111" font-weight="700">Choose protein</text>
    <rect x="254" y="14" width="88" height="24" rx="12" fill="#F4F3EE"/>
    <text x="298" y="30" font-size="10.5" fill="#111111" font-weight="700" text-anchor="middle" font-family="monospace">REQUIRED</text>

    <!-- Option 1: Chicken (Selected) -->
    <g transform="translate(0, 52)">
      <circle cx="14" cy="18" r="10" fill="none" stroke="#111111" stroke-width="2"/>
      <circle cx="14" cy="18" r="5" fill="#111111"/>
      <text x="38" y="23" font-size="15" fill="#111111" font-weight="600">Chicken</text>
      <text x="342" y="23" font-size="14" fill="#666666" text-anchor="end">+$0.00</text>
      <line x1="38" y1="36" x2="342" y2="36" stroke="#FAF9F5" stroke-width="1"/>
    </g>

    <!-- Option 2: Tofu -->
    <g transform="translate(0, 96)">
      <circle cx="14" cy="18" r="10" fill="none" stroke="#C5C2B8" stroke-width="2"/>
      <text x="38" y="23" font-size="15" fill="#333333" font-weight="500">Tofu</text>
      <text x="342" y="23" font-size="14" fill="#666666" text-anchor="end">+$0.00</text>
      <line x1="38" y1="36" x2="342" y2="36" stroke="#FAF9F5" stroke-width="1"/>
    </g>

    <!-- Option 3: Shrimp -->
    <g transform="translate(0, 140)">
      <circle cx="14" cy="18" r="10" fill="none" stroke="#C5C2B8" stroke-width="2"/>
      <text x="38" y="23" font-size="15" fill="#333333" font-weight="500">Shrimp</text>
      <text x="342" y="23" font-size="14" fill="#666666" text-anchor="end">+$3.00</text>
    </g>
  </g>

  <!-- SPECIAL REQUEST SECTION -->
  <g transform="translate(24, 570)">
    <line x1="0" y1="0" x2="342" y2="0" stroke="#EAE8E1" stroke-width="1"/>
    <text x="0" y="28" font-size="16" fill="#111111" font-weight="700">Special request</text>
    <rect x="0" y="42" width="342" height="48" rx="10" fill="#FAF9F5" stroke="#DCD9D0" stroke-width="1"/>
    <text x="16" y="72" font-size="14" fill="#888888">e.g. sauce on side, less spicy</text>
  </g>

  <!-- STICKY BOTTOM BUTTON -->
  <g transform="translate(24, 730)">
    <rect width="342" height="54" rx="14" fill="#111111"/>
    <text x="171" y="33" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">Add 1 to cart · $14.50</text>
  </g>

  <!-- HOME BAR -->
  <rect x="125" y="820" width="140" height="5" rx="2.5" fill="#111111"/>
</svg>
