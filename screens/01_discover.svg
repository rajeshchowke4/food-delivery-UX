<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'Roboto Mono', Consolas, monospace; }
      .bold { font-weight: 700; }
      .semibold { font-weight: 600; }
      .regular { font-weight: 400; }
    </style>
  </defs>

  <!-- BACKGROUND & PHONE FRAME -->
  <rect width="390" height="844" rx="44" fill="#FFFFFF"/>
  <rect x="1" y="1" width="388" height="842" rx="43" fill="none" stroke="#E5E3DD" stroke-width="2"/>

  <!-- DYNAMIC ISLAND / NOTCH -->
  <rect x="135" y="12" width="120" height="30" rx="15" fill="#111111"/>

  <!-- STATUS BAR -->
  <text x="36" y="32" font-size="14" fill="#111111" font-weight="600">10:11</text>
  <g transform="translate(325, 22)">
    <!-- Cellular -->
    <path d="M0 10 L3 10 M5 8 L8 8 M10 5 L13 5 M15 2 L18 2" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <!-- Battery -->
    <rect x="24" y="2" width="20" height="10" rx="3" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="26" y="4" width="14" height="6" rx="1.5" fill="#111111"/>
    <line x1="45" y1="5" x2="45" y2="9" stroke="#111111" stroke-width="1.5"/>
  </g>

  <!-- TOP BAR: ADDRESS PICKER & AVATAR -->
  <g transform="translate(24, 60)">
    <path d="M4 14 C1 14 0 11 0 7 C0 3 4 0 8 0 C12 0 16 3 16 7 C16 11 15 14 8 20 C4 16 4 14 4 14 Z" fill="none" stroke="#111111" stroke-width="1.8"/>
    <circle cx="8" cy="7" r="2.5" fill="#111111"/>
    <text x="26" y="15" font-size="17" fill="#111111" font-weight="700">18 Mercer Street</text>
    <path d="M168 10 L173 15 L178 10" fill="none" stroke="#777777" stroke-width="2" stroke-linecap="round"/>

    <!-- Avatar Profile -->
    <circle cx="332" cy="11" r="16" fill="#F4F3EE" stroke="#E2DFD7" stroke-width="1.5"/>
    <circle cx="332" cy="7" r="5" fill="#555555"/>
    <path d="M322 22 C322 17 326 15 332 15 C338 15 342 17 342 22" fill="#555555"/>
  </g>

  <!-- SEARCH BAR -->
  <g transform="translate(24, 108)">
    <rect width="342" height="48" rx="12" fill="#F7F6F2" stroke="#E5E3DD" stroke-width="1"/>
    <circle cx="22" cy="24" r="7" fill="none" stroke="#888888" stroke-width="2"/>
    <line x1="27" y1="29" x2="33" y2="35" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
    <text x="44" y="29" font-size="15" fill="#888888">Search dishes, restaurants...</text>
  </g>

  <!-- HERO PROMO / VALUE PROP BOX -->
  <g transform="translate(24, 174)">
    <rect width="342" height="136" rx="16" fill="#F7F6F2" stroke="#E2DFD7" stroke-width="1"/>
    <line x1="0" y1="0" x2="342" y2="136" stroke="#ECEAE4" stroke-width="1.5"/>
    <line x1="0" y1="136" x2="342" y2="0" stroke="#ECEAE4" stroke-width="1.5"/>
    <rect x="20" y="24" width="160" height="18" rx="4" fill="#DCD9D0"/>
    <rect x="20" y="52" width="220" height="14" rx="3" fill="#EAE8E1"/>
    <rect x="20" y="74" width="120" height="14" rx="3" fill="#EAE8E1"/>
    <rect x="20" y="98" width="80" height="20" rx="10" fill="#111111"/>
    <text x="60" y="112" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">Explore</text>
  </g>

  <!-- QUICK FILTER CHIPS -->
  <g transform="translate(24, 328)">
    <!-- Popular (Active) -->
    <rect width="84" height="34" rx="17" fill="#111111"/>
    <text x="42" y="22" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Popular</text>
    
    <!-- Fast -->
    <rect x="94" width="68" height="34" rx="17" fill="#FFFFFF" stroke="#DCD9D0" stroke-width="1"/>
    <text x="128" y="22" font-size="13" fill="#444444" font-weight="500" text-anchor="middle">Fast</text>
    
    <!-- Price $ -->
    <rect x="172" width="80" height="34" rx="17" fill="#FFFFFF" stroke="#DCD9D0" stroke-width="1"/>
    <text x="212" y="22" font-size="13" fill="#444444" font-weight="500" text-anchor="middle">Price $</text>

    <!-- Top Rated -->
    <rect x="262" width="94" height="34" rx="17" fill="#FFFFFF" stroke="#DCD9D0" stroke-width="1"/>
    <text x="309" y="22" font-size="13" fill="#444444" font-weight="500" text-anchor="middle">Rating 4.5+</text>
  </g>

  <!-- SECTION HEADER -->
  <g transform="translate(24, 388)">
    <text x="0" y="16" font-size="18" fill="#111111" font-weight="700">Near you · under 25 min</text>
    <text x="342" y="15" font-size="13" fill="#666666" text-anchor="end">See all (24)</text>
  </g>

  <!-- RESTAURANT CARDS LIST -->
  <g transform="translate(24, 420)">
    <!-- Card 1: Siam Corner -->
    <g transform="translate(0, 0)">
      <rect width="342" height="96" rx="14" fill="#FAF9F5" stroke="#EAE8E1" stroke-width="1"/>
      <!-- Image Thumbnail Box -->
      <rect x="12" y="12" width="72" height="72" rx="10" fill="#EAE8E1"/>
      <line x1="12" y1="12" x2="84" y2="84" stroke="#D8D5CC" stroke-width="1"/>
      <line x1="12" y1="84" x2="84" y2="12" stroke="#D8D5CC" stroke-width="1"/>
      
      <!-- Details -->
      <text x="96" y="32" font-size="16" fill="#111111" font-weight="700">Siam Corner</text>
      <text x="96" y="54" font-size="13" fill="#555555">★ 4.8 (1.2k) · Thai cuisine</text>
      <text x="96" y="74" font-size="13" fill="#111111" font-weight="600">20–25 min · $1.99 delivery</text>
    </g>

    <!-- Card 2: Pasta Poet -->
    <g transform="translate(0, 110)">
      <rect width="342" height="96" rx="14" fill="#FAF9F5" stroke="#EAE8E1" stroke-width="1"/>
      <rect x="12" y="12" width="72" height="72" rx="10" fill="#EAE8E1"/>
      <line x1="12" y1="12" x2="84" y2="84" stroke="#D8D5CC" stroke-width="1"/>
      <line x1="12" y1="84" x2="84" y2="12" stroke="#D8D5CC" stroke-width="1"/>
      
      <text x="96" y="32" font-size="16" fill="#111111" font-weight="700">Pasta Poet</text>
      <text x="96" y="54" font-size="13" fill="#555555">★ 4.6 (850) · Handmade Pasta</text>
      <text x="96" y="74" font-size="13" fill="#111111" font-weight="600">15–20 min · $0.99 delivery</text>
    </g>

    <!-- Card 3: Green Garden Bowls -->
    <g transform="translate(0, 220)">
      <rect width="342" height="96" rx="14" fill="#FAF9F5" stroke="#EAE8E1" stroke-width="1"/>
      <rect x="12" y="12" width="72" height="72" rx="10" fill="#EAE8E1"/>
      <line x1="12" y1="12" x2="84" y2="84" stroke="#D8D5CC" stroke-width="1"/>
      <line x1="12" y1="84" x2="84" y2="12" stroke="#D8D5CC" stroke-width="1"/>
      
      <text x="96" y="32" font-size="16" fill="#111111" font-weight="700">Green Garden</text>
      <text x="96" y="54" font-size="13" fill="#555555">★ 4.9 (2.1k) · Salads &amp; Bowls</text>
      <text x="96" y="74" font-size="13" fill="#111111" font-weight="600">20–30 min · $1.49 delivery</text>
    </g>
  </g>

  <!-- BOTTOM TAB NAVIGATION -->
  <g transform="translate(0, 756)">
    <rect width="390" height="88" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#EAE8E1" stroke-width="1"/>
    
    <!-- Home (Active) -->
    <g transform="translate(65, 14)">
      <circle cx="0" cy="10" r="10" fill="#111111"/>
      <path d="M-5 10 L0 5 L5 10 L5 14 L-5 14 Z" fill="#FFFFFF"/>
      <text x="0" y="28" font-size="10" fill="#111111" font-weight="700" text-anchor="middle">Explore</text>
    </g>

    <!-- Orders -->
    <g transform="translate(195, 14)">
      <rect x="-8" y="2" width="16" height="16" rx="3" fill="none" stroke="#888888" stroke-width="1.8"/>
      <line x1="-4" y1="7" x2="4" y2="7" stroke="#888888" stroke-width="1.5"/>
      <line x1="-4" y1="11" x2="2" y2="11" stroke="#888888" stroke-width="1.5"/>
      <text x="0" y="28" font-size="10" fill="#777777" font-weight="500" text-anchor="middle">Orders</text>
    </g>

    <!-- Profile -->
    <g transform="translate(325, 14)">
      <circle cx="0" cy="6" r="5" fill="none" stroke="#888888" stroke-width="1.8"/>
      <path d="M-8 18 C-8 13 -4 12 0 12 C4 12 8 13 8 18" fill="none" stroke="#888888" stroke-width="1.8"/>
      <text x="0" y="28" font-size="10" fill="#777777" font-weight="500" text-anchor="middle">Account</text>
    </g>

    <!-- Home indicator bar -->
    <rect x="125" y="72" width="140" height="5" rx="2.5" fill="#111111"/>
  </g>
</svg>
