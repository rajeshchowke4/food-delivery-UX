<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;">
  <rect width="390" height="844" rx="44" fill="#FFFFFF"/>
  <rect x="1" y="1" width="388" height="842" rx="43" fill="none" stroke="#E5E3DD" stroke-width="2"/>

  <!-- DYNAMIC ISLAND -->
  <rect x="135" y="12" width="120" height="30" rx="15" fill="#111111"/>
  <text x="36" y="32" font-size="14" fill="#111111" font-weight="600">10:11</text>
  <g transform="translate(325, 22)">
    <path d="M0 10 L3 10 M5 8 L8 8 M10 5 L13 5 M15 2 L18 2" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <rect x="24" y="2" width="20" height="10" rx="3" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="26" y="4" width="14" height="6" rx="1.5" fill="#111111"/>
    <line x1="45" y1="5" x2="45" y2="9" stroke="#111111" stroke-width="1.5"/>
  </g>

  <!-- TOP HEADER -->
  <g transform="translate(24, 60)">
    <path d="M12 0 L2 10 L12 20" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="16" font-size="20" fill="#111111" font-weight="700">Order #7842</text>
    
    <circle cx="338" cy="10" r="14" fill="#F4F3EE"/>
    <circle cx="338" cy="10" r="8" fill="none" stroke="#111111" stroke-width="1.5"/>
    <text x="338" y="13.5" font-size="9" fill="#111111" font-weight="700" text-anchor="middle" font-family="monospace">?</text>
  </g>

  <!-- LIVE MAP VIEW AREA -->
  <g transform="translate(24, 104)">
    <rect width="342" height="230" rx="18" fill="#F4F3EE" stroke="#E2DFD7" stroke-width="1"/>
    
    <!-- Stylized Map Roads -->
    <path d="M0 60 L140 60 L140 180 L342 180" fill="none" stroke="#FFFFFF" stroke-width="14"/>
    <path d="M0 60 L140 60 L140 180 L342 180" fill="none" stroke="#E2DFD7" stroke-width="4"/>
    
    <path d="M220 0 L220 230" fill="none" stroke="#FFFFFF" stroke-width="10"/>
    <path d="M220 0 L220 230" fill="none" stroke="#E2DFD7" stroke-width="3"/>

    <!-- Delivery Path -->
    <path d="M70 60 L140 60 L140 150" fill="none" stroke="#111111" stroke-width="4" stroke-dasharray="6,4" stroke-linecap="round"/>

    <!-- Courier Vehicle Pin -->
    <g transform="translate(140, 150)">
      <circle cx="0" cy="0" r="16" fill="#111111" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
      <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
      <!-- Pulse ring -->
      <circle cx="0" cy="0" r="24" fill="none" stroke="#111111" stroke-width="1.5" opacity="0.3"/>
    </g>

    <!-- Destination Pin (Mercer St) -->
    <g transform="translate(300, 180)">
      <circle cx="0" cy="0" r="12" fill="#EAE8E1" stroke="#111111" stroke-width="2"/>
      <path d="M-4 -3 L0 3 L4 -3" fill="#111111"/>
    </g>

    <!-- Map Label -->
    <rect x="14" y="14" width="115" height="24" rx="12" fill="#FFFFFF" stroke="#E2DFD7" stroke-width="1"/>
    <circle cx="26" cy="26" r="3.5" fill="#10B981"/>
    <text x="36" y="29.5" font-size="11" fill="#111111" font-weight="600">Live GPS tracking</text>
  </g>

  <!-- STATUS CARD OVERLAY -->
  <g transform="translate(24, 350)">
    <rect width="342" height="96" rx="16" fill="#FAF9F5" stroke="#E2DFD7" stroke-width="1.2"/>
    
    <!-- Text -->
    <text x="20" y="34" font-size="19" fill="#111111" font-weight="800">Courier is on the way</text>
    <text x="20" y="56" font-size="14" fill="#666666">Picked up from Siam Corner · 7:04 PM</text>
    <text x="20" y="78" font-size="13" fill="#111111" font-weight="600">On schedule for 7:16 PM delivery</text>

    <!-- 12 min Badge -->
    <rect x="246" y="18" width="76" height="42" rx="10" fill="#111111"/>
    <text x="284" y="44" font-size="18" fill="#FFFFFF" font-weight="800" text-anchor="middle">12 min</text>
  </g>

  <!-- COURIER CONTACT CARD -->
  <g transform="translate(24, 462)">
    <rect width="342" height="88" rx="16" fill="#FFFFFF" stroke="#EAE8E1" stroke-width="1"/>
    
    <!-- Courier Avatar -->
    <circle cx="44" cy="44" r="22" fill="#EAE8E1" stroke="#DCD9D0" stroke-width="1"/>
    <text x="44" y="50" font-size="16" fill="#111111" font-weight="700" text-anchor="middle">A</text>

    <!-- Courier Info -->
    <text x="80" y="38" font-size="17" fill="#111111" font-weight="700">Alex · courier</text>
    <text x="80" y="58" font-size="13" fill="#666666">★ 4.9 · White Toyota Camry</text>

    <!-- Call & Message Buttons -->
    <g transform="translate(240, 26)">
      <!-- Call -->
      <circle cx="18" cy="18" r="18" fill="#F4F3EE" stroke="#E2DFD7" stroke-width="1"/>
      <path d="M12 10 C12 18 18 24 26 24 L24 20 L21 21 C18 19 17 18 15 15 L16 12 Z" fill="#111111"/>
      
      <!-- Message -->
      <circle cx="62" cy="18" r="18" fill="#F4F3EE" stroke="#E2DFD7" stroke-width="1"/>
      <path d="M54 13 L70 13 C72 13 73 14 73 16 L73 22 C73 24 72 25 70 25 L65 25 L60 28 L60 25 L54 25 C52 25 51 24 51 22 L51 16 C51 14 52 13 54 13 Z" fill="#111111"/>
    </g>
  </g>

  <!-- DELIVERY DESTINATION DETAILS -->
  <g transform="translate(24, 566)">
    <rect width="342" height="86" rx="14" fill="#FAF9F5" stroke="#EAE8E1" stroke-width="1"/>
    <text x="18" y="26" font-size="11" fill="#777777" font-weight="700" font-family="monospace">DELIVERY DESTINATION</text>
    <text x="18" y="48" font-size="15" fill="#111111" font-weight="700">18 Mercer St, Apt 4A</text>
    <text x="18" y="68" font-size="13" fill="#555555">Instructions: Leave at door, ring bell.</text>
  </g>

  <!-- HELP BUTTON / ACTION -->
  <g transform="translate(24, 690)">
    <rect width="342" height="48" rx="12" fill="#FAF9F5" stroke="#DCD9D0" stroke-width="1"/>
    <text x="171" y="29" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">Get help with this order</text>
  </g>

  <!-- HOME BAR -->
  <rect x="125" y="820" width="140" height="5" rx="2.5" fill="#111111"/>
</svg>
